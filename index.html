<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Fonte do Projeto OBA (título "Projeto OBA®" nos cards de acesso) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />

    <!-- PWA: instalável (ícone OBA RedFairy na tela inicial) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14100E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS: "Adicionar à Tela de Início" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Projeto OBA" />
    <link rel="apple-touch-icon" href="/oba-fairy-v2.png" />

    <title>RedFairy | Projeto OBA</title>
    <!-- Fundo escuro no carregamento (evita o "flash branco" ao entrar nas telas de acesso, que são escuras) -->
    <style>html, body, #root { background-color: #111827; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Captura o evento de "instalável" cedo (pode disparar antes do React montar).
      // O banner "Instalar a fadinha" lê window.__rfInstall depois.
      window.__rfInstall = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__rfInstall = e;
        try { window.dispatchEvent(new Event('rf-installable')); } catch (err) {}
      });
      window.addEventListener('appinstalled', function () { window.__rfInstall = null; });
    </script>
    <script>
      // Registra o Service Worker (necessário pra o app ser instalável).
      // NÃO registra em dev (localhost / IP de LAN) pra não atrapalhar o HMR com
      // cache — só em produção (HTTPS). PWA exige contexto seguro de qualquer forma.
      (function () {
        var h = location.hostname;
        var ehDev = /^(localhost|127\.|0\.0\.0\.0|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
        if ('serviceWorker' in navigator && !ehDev) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        }
      })();
    </script>
  </body>
</html>
